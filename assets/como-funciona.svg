<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="1100" height="240" role="img" aria-label="Cómo se usa: agrega tus exe, elige un ico, aplica el icono" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Cómo se usa CambiarIcono</title>
  <g transform="translate(20 20)">
    <rect width="320" height="200" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="44" cy="46" r="22" fill="#2563EB"/><text x="44" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text>
    <text x="80" y="54" font-size="24" font-weight="700" fill="#0F172A">Agrega tus .exe</text>
    <text x="28" y="108" font-size="18" fill="#475569">Con el botón o arrastrándolos</text>
    <text x="28" y="134" font-size="18" fill="#475569">a la ventana. Acepta varios.</text>
    <g transform="translate(0 16)"><rect x="236" y="130" width="62" height="48" rx="8" fill="#E2E8F5" stroke="#94A3BE" stroke-width="2"/><rect x="236" y="130" width="62" height="14" rx="6" fill="#94A3BE"/><text x="267" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">.exe</text></g>
  </g>
  <path d="M350 120 h40 m-12 -12 l12 12 l-12 12" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(390 20)">
    <rect width="320" height="200" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="44" cy="46" r="22" fill="#2563EB"/><text x="44" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text>
    <text x="80" y="54" font-size="24" font-weight="700" fill="#0F172A">Elige un icono</text>
    <text x="28" y="108" font-size="18" fill="#475569">Selecciona un archivo .ico</text>
    <text x="28" y="134" font-size="18" fill="#475569">y mira la vista previa.</text>
    <g transform="translate(0 16)"><rect x="240" y="130" width="54" height="54" rx="14" fill="#A838F0"/><polygon points="267,140 272,155 288,155 275,164 280,179 267,170 254,179 259,164 246,155 262,155" fill="#fff"/></g>
  </g>
  <path d="M720 120 h40 m-12 -12 l12 12 l-12 12" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(760 20)">
    <rect width="320" height="200" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="44" cy="46" r="22" fill="#2563EB"/><text x="44" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
    <text x="80" y="54" font-size="24" font-weight="700" fill="#0F172A">Aplica el icono</text>
    <text x="28" y="108" font-size="18" fill="#475569">Un clic y listo. Se crea una</text>
    <text x="28" y="134" font-size="18" fill="#475569">copia .bak de seguridad.</text>
    <g transform="translate(0 16)"><rect x="236" y="130" width="62" height="48" rx="8" fill="#E2E8F5" stroke="#94A3BE" stroke-width="2"/><rect x="249" y="144" width="22" height="22" rx="6" fill="#A838F0"/><polygon points="296,126 304,134 276,170 264,174 268,162" fill="#F59E0B"/></g>
  </g>
</svg>
